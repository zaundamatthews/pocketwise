<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — PocketWise AI</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-hero" style="text-align: center; padding-bottom: 36px">
          <div class="brand" style="justify-content: center">
            <div class="brand-mark">🔒</div>
          </div>
          <h1>Forgot Password?</h1>
          <p style="margin: 0 auto">
            No worries! Enter your email and we'll send you a link to reset your
            password.
          </p>
        </div>

        <div class="auth-body">
          <form id="reset-form">
            <div class="field">
              <label for="email">Email</label>
              <div class="field-input">
                <span class="field-icon">✉️</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Send Reset Link
            </button>
          </form>

          <div class="auth-divider">or</div>

          <a href="login.html" class="btn btn-outline btn-block"
            >Back to Login</a
          >
        </div>
      </div>
    </div>

    <script>
      document.getElementById("reset-form").addEventListener("submit", (e) => {
        e.preventDefault();
        alert(
          "Demo mode: in the real app, a reset link would be emailed here.",
        );
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
