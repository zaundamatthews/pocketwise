<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — PocketWise AI</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-hero" style="text-align: center; padding-bottom: 36px">
          <div class="brand" style="justify-content: center">
            <div class="brand-mark">🔒</div>
          </div>
          <h1>Forgot Password?</h1>
          <p style="margin: 0 auto">
            No worries! Enter your email and we'll send you a link to reset your
            password.
          </p>
        </div>

        <div class="auth-body">
          <form id="reset-form">
            <div class="field">
              <label for="email">Email</label>
              <div class="field-input">
                <span class="field-icon">✉️</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Send Reset Link
            </button>
            <p id="message"></p>
          </form>

          <div class="auth-divider">or</div>

          <a href="./login.html" class="btn btn-outline btn-block"
            >Back to Login</a
          >
        </div>
      </div>
    </div>
    <script>
      const resetForm = document.getElementById("reset-form");
      const messageElement = document.getElementById("message");
      const submitButton = resetForm.querySelector('button[type="submit"]');

      resetForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();

        messageElement.textContent = "";
        submitButton.disabled = true;
        submitButton.textContent = "Sending...";

        try {
          const response = await fetch(
            `${API_BASE}/api/auth/forgot-password`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email }),
            },
          );

          const data = await response.json();

          messageElement.textContent =
            data.message ||
            "If an account exists with that email, a reset link has been sent.";

          if (response.ok) {
            resetForm.reset();
          }
        } catch (error) {
          console.error("Forgot password error:", error);

          messageElement.textContent = "Could not connect to the server.";
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Send Reset Link";
        }
      });
    </script>
  </body>
</html>
