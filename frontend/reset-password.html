<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset-Password</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-hero" style="text-align: center; padding-bottom: 36px">
          <div class="brand" style="justify-content: center">
            <div class="brand-mark">🔒</div>
          </div>
          <h1>Reset Password</h1>
          <p style="margin: 0 auto">Fill In Your New Password</p>
        </div>

        <div class="auth-body">
          <form id="reset-form">
            <div class="field">
              <label for="newPassword">New Password</label>
              <div class="field-input">
                <span class="field-icon">🔒</span>
                <input
                  type="password"
                  id="newPassword"
                  placeholder="Enter New Password"
                  required
                />
              </div>
            </div>
            <div class="field">
              <label for="confirmNewPassword">Confirm Password</label>
              <div class="field-input">
                <span class="field-icon">🔒</span>
                <input
                  type="password"
                  id="confirmNewPassword"
                  placeholder="Confirm New Password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Reset Password
            </button>
          </form>

          <div class="auth-divider">or</div>

          <a href="login.html" class="btn btn-outline btn-block"
            >Back to Login</a
          >
        </div>
      </div>
    </div>
    <!-- Form Verification -->
    <script>
      const USE_MOCK_DATA = false;

const API_BASE =
  'https://pocketwise-deployment-production.up.railway.app/api';
      const resetForm = document.getElementById("reset-form");
      const submitButton = resetForm.querySelector('button[type="submit"]');

      const messageElement = document.createElement("p");
      messageElement.id = "message";
      resetForm.appendChild(messageElement);

      // Read the reset token from:
      // reset-password.html?token=abc123...
      const queryParams = new URLSearchParams(window.location.search);
      const token = queryParams.get("token");

      if (!token) {
        messageElement.textContent =
          "The password reset link is missing or invalid.";

        submitButton.disabled = true;
      }

      resetForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmNewPassword").value;

        messageElement.textContent = "";

        if (password.length < 8) {
          messageElement.textContent =
            "Password must contain at least 8 characters.";
          return;
        }

        if (password !== confirmPassword) {
          messageElement.textContent =
            "Passwords do not match. Please check and try again.";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Resetting...";

        try {
          const response = await fetch(
            `${API_BASE}/auth/reset-password/${token}`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                password,
                confirmPassword,
              }),
            },
          );

          const data = await response.json();

          if (!response.ok) {
            messageElement.textContent =
              data.message ||
              "Unable to reset password. The link may have expired.";
            return;
          }

          messageElement.textContent =
            data.message || "Password reset successfully.";

          resetForm.reset();

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } catch (error) {
          console.error("Reset password error:", error);

          messageElement.textContent =
            "Could not connect to the server. Check that the backend is running.";
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Reset Password";
        }
      });
    </script>
  </body>
</html>
