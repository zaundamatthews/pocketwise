<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — PocketWise AI</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-hero">
          <div class="brand">
            <div class="brand-mark">💼</div>
            <div>
              <div class="brand-name">PocketWise <span>AI</span></div>
              <div class="brand-tag">Your AI Financial Coach</div>
            </div>
          </div>
          <h1>Create Account</h1>
          <p>Join PocketWise AI today and start tracking your finances.</p>
        </div>

        <div class="auth-body">
          <!-- Sign UP FORM -->
          <form id="signup-form">
            <div class="field">
              <label for="fullname">Full Name</label>
              <div class="field-input">
                <span class="field-icon">👤</span>
                <input
                  type="text"
                  id="fullname"
                  placeholder="Enter your full name"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <div class="field-input">
                <span class="field-icon">✉️</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="field-input">
                <span class="field-icon">🔒</span>
                <input
                  type="password"
                  id="password"
                  placeholder="Create a password"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="confirm">Confirm Password</label>
              <div class="field-input">
                <span class="field-icon">🔒</span>
                <input
                  type="password"
                  id="confirm"
                  placeholder="Confirm your password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Sign Up
            </button>
          </form>

          <div class="auth-foot">
            Already have an account? <a href="login.html">Login</a>
          </div>
        </div>
      </div>
    </div>
    <!-- Form Verification -->
   <script>
    const USE_MOCK_DATA = false;

const API_BASE =
  'https://pocketwise-deployment-production.up.railway.app/api';
  const signupForm = document.getElementById("signup-form");

  signupForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const fullName = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm").value;

    if (!fullName || !email || !password || !confirmPassword) {
      alert("Please complete all fields.");
      return;
    }

    if (password !== confirmPassword) {
      alert("Passwords do not match.");
      return;
    }

    try {
      const response = await fetch(
        `${API_BASE}/auth/register`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            fullName: fullName,
            email: email,
            password: password,
          }),
        }
      );

      const data = await response.json();

      console.log("Status:", response.status);
      console.log("Response:", data);

      if (!response.ok) {
        alert(data.message || "Registration failed.");
        return;
      }

      alert(data.message || "Account created successfully.");
      window.location.href = "login.html";
    } catch (error) {
      console.error("Registration request failed:", error);
      alert(
        "Could not connect to the backend. Make sure the server is running on port 5000."
      );
    }
  });
</script>
  </body>
</html>
